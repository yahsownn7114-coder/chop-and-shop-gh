name: Build CHOP & SHOP GH Android App

on:
  workflow_dispatch:
  push:
    paths:
      - 'CHOP_AND_SHOP_GH_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract app project
        run: |
          unzip CHOP_AND_SHOP_GH_Android_Project.zip -d extracted
          ls extracted

      - name: Build Android APK
        run: |
          cd extracted/CHOP_AND_SHOP_GH_Android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Chop-And-Shop-GH-APK
          path: extracted/CHOP_AND_SHOP_GH_Android/app/build/outputs/apk/debug/*.apk
